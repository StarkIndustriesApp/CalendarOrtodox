<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#b3161c"/>
      <stop offset="1" stop-color="#5c060b"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe7a0"/>
      <stop offset=".45" stop-color="#e9bc55"/>
      <stop offset="1" stop-color="#b98424"/>
    </linearGradient>
    <radialGradient id="halo" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fff0bf"/>
      <stop offset=".6" stop-color="#f0c75a"/>
      <stop offset="1" stop-color="#c8922a"/>
    </radialGradient>
    <linearGradient id="maph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8e2a1a"/>
      <stop offset="1" stop-color="#4a100a"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3b384"/>
      <stop offset="1" stop-color="#c08a5c"/>
    </linearGradient>
    <linearGradient id="child" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd877"/>
      <stop offset=".5" stop-color="#e9a83a"/>
      <stop offset="1" stop-color="#b8701c"/>
    </linearGradient>
    <symbol id="star" viewBox="-10 -10 20 20">
      <path d="M0 -10 L2.4 -2.4 L10 0 L2.4 2.4 L0 10 L-2.4 2.4 L-10 0 L-2.4 -2.4 Z" fill="#f3cf6e"/>
    </symbol>
    <clipPath id="arch">
      <path d="M182 1024 V360 C182 200 330 112 512 112 C694 112 842 200 842 360 V1024 Z"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- gold arched panel -->
  <path d="M182 1024 V360 C182 200 330 112 512 112 C694 112 842 200 842 360 V1024 Z" fill="url(#panel)"/>

  <g clip-path="url(#arch)">
    <!-- Mary's halo -->
    <circle cx="452" cy="360" r="166" fill="url(#halo)" stroke="#a8761a" stroke-width="6"/>
    <circle cx="452" cy="360" r="148" fill="none" stroke="#a8761a" stroke-opacity=".5" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>

    <!-- maphorion -->
    <path d="M452 214 C364 214 312 288 306 384 C300 476 272 560 214 640 C176 700 164 860 160 1024 L880 1024 C876 880 852 780 800 712 C732 626 640 560 606 414 C590 300 540 214 452 214 Z" fill="url(#maph)"/>
    <!-- gold hem of the maphorion -->
    <path d="M216 640 C272 560 300 476 306 384" fill="none" stroke="#e2b04a" stroke-width="9" stroke-linecap="round"/>
    <!-- folds -->
    <path d="M260 760 C300 820 330 900 340 1024" fill="none" stroke="#3a0b06" stroke-width="6" opacity=".6"/>
    <path d="M330 640 C360 700 390 760 400 830" fill="none" stroke="#3a0b06" stroke-width="5" opacity=".5"/>

    <!-- Mary's face (tilted to the Child) -->
    <g transform="rotate(12 456 398)">
      <path d="M372 482 C350 366 390 274 456 272 C522 274 562 366 540 482 C492 516 420 516 372 482 Z" fill="#1d2f5c"/>
      <path d="M372 482 C350 366 390 274 456 272 C522 274 562 366 540 482" fill="none" stroke="#e2b04a" stroke-width="9" stroke-linecap="round"/>
      <path d="M456 298 C512 298 534 350 530 410 C526 466 496 506 456 506 C416 506 386 466 382 410 C378 350 400 298 456 298 Z" fill="url(#skin)"/>
      <!-- brows -->
      <path d="M404 378 C420 366 440 366 450 374" fill="none" stroke="#4a2a12" stroke-width="5" stroke-linecap="round"/>
      <path d="M464 374 C476 366 496 366 510 378" fill="none" stroke="#4a2a12" stroke-width="5" stroke-linecap="round"/>
      <!-- almond eyes looking out -->
      <path d="M408 398 C420 388 438 388 448 398 C438 406 420 406 408 398 Z" fill="#fbf2e2"/>
      <circle cx="430" cy="398" r="7" fill="#3a200d"/>
      <path d="M408 398 C420 388 438 388 448 398" fill="none" stroke="#2a1608" stroke-width="4" stroke-linecap="round"/>
      <path d="M466 398 C476 388 494 388 506 398 C494 406 476 406 466 398 Z" fill="#fbf2e2"/>
      <circle cx="486" cy="398" r="7" fill="#3a200d"/>
      <path d="M466 398 C476 388 494 388 506 398" fill="none" stroke="#2a1608" stroke-width="4" stroke-linecap="round"/>
      <!-- long nose -->
      <path d="M458 382 C458 414 454 438 448 446 C456 452 466 452 472 446" fill="none" stroke="#8f5a34" stroke-width="4" stroke-linecap="round"/>
      <!-- small mouth -->
      <path d="M444 472 C452 468 464 468 472 472 C464 480 452 480 444 472 Z" fill="#9c3e30"/>
      <ellipse cx="418" cy="440" rx="16" ry="9" fill="#d97a62" opacity=".28"/>
      <ellipse cx="496" cy="440" rx="16" ry="9" fill="#d97a62" opacity=".28"/>
    </g>

    <!-- stars on forehead and shoulder -->
    <use href="#star" x="434" y="226" width="36" height="36"/>
    <use href="#star" x="236" y="666" width="40" height="40"/>

    <!-- Child's halo with cross -->
    <circle cx="640" cy="540" r="96" fill="url(#halo)" stroke="#a8761a" stroke-width="6"/>
    <g fill="#9e1a14" stroke="#6a0c08" stroke-width="3">
      <path d="M622 446 L658 446 L652 482 L628 482 Z"/>
      <path d="M734 522 L734 558 L700 552 L700 528 Z"/>
      <path d="M546 522 L546 558 L580 552 L580 528 Z"/>
    </g>

    <!-- Child's golden robe -->
    <path d="M582 600 C540 640 520 720 530 820 C600 856 720 856 790 820 C800 720 770 640 706 604 C666 622 620 622 582 600 Z" fill="url(#child)"/>
    <path d="M620 616 C640 690 640 760 612 840" fill="none" stroke="#fff1b8" stroke-width="4" opacity=".8"/>
    <path d="M690 620 C720 690 740 760 742 830" fill="none" stroke="#fff1b8" stroke-width="4" opacity=".7"/>
    <path d="M660 640 C676 700 690 770 690 840" fill="none" stroke="#8a4f10" stroke-width="4" opacity=".6"/>

    <!-- Mary's hand supporting the Child -->
    <path d="M470 840 C500 798 560 786 624 806 C646 814 644 838 622 842 C590 850 562 856 540 874 C506 896 466 888 470 840 Z" fill="url(#skin)"/>
    <path d="M560 822 C582 818 602 820 618 826" fill="none" stroke="#8f5a34" stroke-width="3" stroke-linecap="round"/>
    <!-- Mary's sleeve -->
    <path d="M372 870 C384 818 436 794 484 818 C496 850 482 888 446 906 C410 922 368 906 372 870 Z" fill="url(#maph)"/>
    <path d="M484 818 C496 850 482 888 446 906" fill="none" stroke="#e2b04a" stroke-width="8" stroke-linecap="round"/>

    <!-- Child's face -->
    <circle cx="640" cy="548" r="54" fill="url(#skin)"/>
    <path d="M588 540 C592 504 614 488 640 488 C668 488 690 504 692 540 C676 518 658 512 640 512 C622 512 604 518 588 540 Z" fill="#5a3519"/>
    <path d="M616 548 C622 542 632 542 636 548 C632 552 622 552 616 548 Z" fill="#fbf2e2"/>
    <circle cx="626" cy="548" r="4" fill="#3a200d"/>
    <path d="M646 548 C650 542 660 542 666 548 C660 552 650 552 646 548 Z" fill="#fbf2e2"/>
    <circle cx="656" cy="548" r="4" fill="#3a200d"/>
    <path d="M641 552 C640 566 637 572 634 576 C639 579 645 579 648 576" fill="none" stroke="#8f5a34" stroke-width="3" stroke-linecap="round"/>
    <path d="M632 590 C638 594 646 594 652 590" fill="none" stroke="#9c3e30" stroke-width="4" stroke-linecap="round"/>

    <!-- Child holding a scroll -->
    <g transform="rotate(-18 690 720)">
      <rect x="660" y="690" width="26" height="70" rx="6" fill="#fff4dc" stroke="#a8761a" stroke-width="4"/>
      <ellipse cx="673" cy="690" rx="13" ry="6" fill="#f1e2bd" stroke="#a8761a" stroke-width="4"/>
      <path d="M684 716 C700 708 712 714 712 728 C712 742 698 748 684 742 Z" fill="url(#skin)"/>
    </g>
  </g>

  <!-- arch frame -->
  <path d="M182 1024 V360 C182 200 330 112 512 112 C694 112 842 200 842 360 V1024" fill="none" stroke="#7a4e0c" stroke-width="10"/>
  <path d="M200 1024 V362 C200 216 340 130 512 130 C684 130 824 216 824 362 V1024" fill="none" stroke="#fff0bf" stroke-opacity=".6" stroke-width="4"/>
</svg>
